<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Nilai</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; }
    input { display: block; width: 100%; padding: 8px; margin: 8px 0; }
    button { padding: 10px 20px; cursor: pointer; }
    #hasil { margin-top: 20px; font-weight: bold; background: #f0f0f0; padding: 10px; }
  </style>
</head>
<body>
  <h1>Kalkulator Nilai Rapor</h1>
  
  <label for="tugas">Nilai Tugas:</label>
  <input type="number" id="tugas" placeholder="contoh: 85">
  
  <label for="uts">Nilai UTS:</label>
  <input type="number" id="uts" placeholder="contoh: 78">
  
  <label for="uas">Nilai UAS:</label>
  <input type="number" id="uas" placeholder="contoh: 89">

  <button id="hitung">Hitung</button>

  <p id="hasil">Hasil akan muncul di sini</p>

  <script src="js/kalkulator.js"></script>
</body>
</html>
